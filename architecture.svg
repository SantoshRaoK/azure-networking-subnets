<svg width="680" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#ffffff; font-family: Arial, sans-serif;">
  <title>Azure Subnet Architecture</title>
  <desc>Azure resource group rg1 containing virtual network vnet1 with two subnets: sub-net1 (10.0.0.0/24) with no resources, and sub-net2 (10.0.1.0/24) containing virtual machine vm1 with private IP 10.0.1.4 and no public IP.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Resource Group: rg1 -->
  <rect x="30" y="30" width="620" height="480" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="54" y="62" font-size="14" font-weight="500" fill="#2C2C2A" font-family="Arial, sans-serif">Resource group: rg1</text>
  <text x="54" y="80" font-size="12" fill="#5F5E5A" font-family="Arial, sans-serif">Australia East  ·  Azure subscription 1</text>

  <!-- VNet: vnet1 -->
  <rect x="56" y="100" width="568" height="390" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="80" y="130" font-size="14" font-weight="500" fill="#0C447C" font-family="Arial, sans-serif">Virtual network: vnet1</text>
  <text x="80" y="148" font-size="12" fill="#185FA5" font-family="Arial, sans-serif">Address space: 10.0.0.0/8</text>

  <!-- sub-net1 -->
  <rect x="80" y="168" width="232" height="296" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="196" y="196" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" font-family="Arial, sans-serif">sub-net1</text>
  <text x="196" y="214" font-size="12" fill="#0F6E56" text-anchor="middle" font-family="Arial, sans-serif">10.0.0.0/24</text>

  <!-- sub-net1 IP info box -->
  <rect x="102" y="232" width="188" height="56" rx="8" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="196" y="254" font-size="12" fill="#085041" text-anchor="middle" font-family="Arial, sans-serif">251 available IPs</text>
  <text x="196" y="272" font-size="12" fill="#085041" text-anchor="middle" font-family="Arial, sans-serif">No resources deployed</text>

  <!-- sub-net1 reserved IPs note -->
  <rect x="102" y="304" width="188" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="196" y="322" font-size="12" fill="#085041" text-anchor="middle" font-family="Arial, sans-serif">Azure reserved IPs</text>
  <text x="120" y="342" font-size="12" fill="#0F6E56" font-family="Arial, sans-serif">10.0.0.0  — network addr</text>
  <text x="120" y="358" font-size="12" fill="#0F6E56" font-family="Arial, sans-serif">10.0.0.1  — default gateway</text>
  <text x="120" y="374" font-size="12" fill="#0F6E56" font-family="Arial, sans-serif">10.0.0.2  — Azure DNS</text>
  <text x="120" y="390" font-size="12" fill="#0F6E56" font-family="Arial, sans-serif">10.0.0.255 — broadcast</text>

  <!-- sub-net2 -->
  <rect x="368" y="168" width="232" height="296" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="484" y="196" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" font-family="Arial, sans-serif">sub-net2</text>
  <text x="484" y="214" font-size="12" fill="#534AB7" text-anchor="middle" font-family="Arial, sans-serif">10.0.1.0/24</text>

  <!-- sub-net2 IP info box -->
  <rect x="390" y="232" width="188" height="56" rx="8" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
  <text x="484" y="254" font-size="12" fill="#26215C" text-anchor="middle" font-family="Arial, sans-serif">251 available IPs</text>
  <text x="484" y="272" font-size="12" fill="#26215C" text-anchor="middle" font-family="Arial, sans-serif">VM deployed here</text>

  <!-- vm1 box inside sub-net2 -->
  <rect x="390" y="308" width="188" height="120" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
  <text x="484" y="334" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle" font-family="Arial, sans-serif">vm1</text>
  <text x="484" y="352" font-size="12" fill="#712B13" text-anchor="middle" font-family="Arial, sans-serif">Ubuntu 24.04 LTS</text>
  <text x="484" y="372" font-size="12" fill="#712B13" text-anchor="middle" font-family="Arial, sans-serif">Private IP: 10.0.1.4</text>
  <text x="484" y="390" font-size="12" fill="#712B13" text-anchor="middle" font-family="Arial, sans-serif">NIC: vm1965</text>
  <text x="484" y="408" font-size="12" fill="#712B13" text-anchor="middle" font-family="Arial, sans-serif">No public IP</text>

  <!-- Arrow between subnets -->
  <line x1="312" y1="316" x2="366" y2="316" stroke="#888780" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="340" y="310" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="Arial, sans-serif">same VNet</text>
  <text x="340" y="328" font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="Arial, sans-serif">can communicate</text>

  <!-- Legend -->
  <rect x="80" y="476" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="100" y="487" font-size="12" fill="#444441" font-family="Arial, sans-serif">sub-net1 (unused)</text>
  <rect x="222" y="476" width="14" height="14" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="242" y="487" font-size="12" fill="#444441" font-family="Arial, sans-serif">sub-net2 (has VM)</text>
  <rect x="364" y="476" width="14" height="14" rx="3" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
  <text x="384" y="487" font-size="12" fill="#444441" font-family="Arial, sans-serif">vm1 (10.0.1.4)</text>
</svg>
